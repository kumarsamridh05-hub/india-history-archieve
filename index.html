<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHARAT COMMAND | COMMANDER SAMRIDH</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #39ff14;
            --deep-bg: #010206;
            --saffron: #FF9933;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--deep-bg);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(1, 2, 6, 0.94), rgba(1, 2, 6, 0.94)),
                url('https://upload.wikimedia.org/wikipedia/commons/1/17/Ashoka_Chakra.svg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 50%;
            transition: background 0.2s;
        }

        /* RED ALERT PULSE */
        body.alert-active { animation: emergency-red 0.5s infinite; }
        @keyframes emergency-red { 0% { background-color: #000; } 50% { background-color: #800; } 100% { background-color: #000; } }

        header {
            padding: 15px;
            background: rgba(0,0,0,0.95);
            border-bottom: 2px solid var(--neon-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .btn-group { display: flex; gap: 10px; }
        
        .action-btn {
            padding: 10px 15px;
            font-family: 'Orbitron';
            font-size: 0.75rem;
            cursor: pointer;
            border: 2px solid white;
            font-weight: bold;
        }

        .red-btn { background: #ff0000; color: white; border-color: #fff; box-shadow: 0 0 10px red; }
        .anthem-btn { background: #138808; color: white; border-color: #fff; }

        .search-container { width: 100%; margin-top: 10px; }
        #searchBar {
            width: 100%; background: #000; border: 1px solid var(--neon-green);
            color: var(--neon-green); padding: 12px; font-family: 'Orbitron';
        }

        .viewport { display: flex; flex: 1; overflow: hidden; }

        nav {
            width: 240px;
            background: rgba(0,0,0,0.9);
            border-right: 1px solid #333;
            overflow-y: auto;
        }

        .tab {
            width: 100%; padding: 25px 15px; background: none; border: none;
            color: #555; text-align: left; font-family: 'Orbitron';
            cursor: pointer; font-size: 0.8rem; border-bottom: 1px solid #111;
        }

        .tab.active { color: var(--neon-green); background: rgba(57, 255, 20, 0.1); border-left: 5px solid var(--neon-green); }

        main { flex: 1; padding: 40px; overflow-y: auto; position: relative; }
        .intel-title { font-size: 2.2rem; color: var(--saffron); margin-bottom: 20px; font-family: 'Orbitron'; }
        .intel-body { font-size: 1.2rem; line-height: 1.8; color: var(--neon-green) !important; white-space: pre-wrap; text-align: justify; padding-bottom: 100px; }

        #alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,0,0,0.3); display: none; z-index: 999;
            pointer-events: none;
        }

        #countdown-box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: red; color: white; padding: 40px; border: 5px solid white;
            text-align: center; font-family: 'Orbitron'; z-index: 1000; display: none;
        }

        @media (max-width: 768px) {
            .viewport { flex-direction: column; }
            nav { width: 100%; height: 160px; border-right: none; }
        }
    </style>
</head>
<body id="mainBody">

    <div id="alert-overlay"></div>
    <div id="countdown-box">
        <h1 style="font-size: 3rem;">SYSTEM BREACH</h1>
        <p>SELF-DESTRUCT IN:</p>
        <h1 id="timer" style="font-size: 5rem;">10</h1>
    </div>

    <header>
        <h1 style="font-family: 'Orbitron'; color: white;">BHARAT_COMMAND_V9</h1>
        <div class="btn-group">
            <button class="action-btn anthem-btn" onclick="startAnthem()">PLAY ANTHEM</button>
            <button class="action-btn red-btn" onclick="triggerRedAlert()">RED ALERT</button>
        </div>
        <div class="search-container">
            <input type="text" id="searchBar" placeholder="SEARCH (1971, KARGIL, DAKAIT)...">
        </div>
    </header>

    <div class="viewport">
        <nav>
            <button class="tab active" onclick="loadIntel('war47')">01. 1947 KASHMIR</button>
            <button class="tab" onclick="loadIntel('war65')">02. 1965 PATTONS</button>
            <button class="tab" onclick="loadIntel('war71')">03. 1971 VICTORY</button>
            <button class="tab" onclick="loadIntel('war99')">04. 1999 KARGIL</button>
            <button class="tab" onclick="loadIntel('dakait')">05. DAKAIT INTEL</button>
            <button class="tab" onclick="loadIntel('samridh')">06. THE DEVELOPER</button>
        </nav>

        <main id="mainScroll">
            <h2 class="intel-title" id="titleArea">SYSTEM ONLINE</h2>
            <div class="intel-body" id="bodyArea">WELCOME COMMANDER SAMRIDH. ACCESS THE ARCHIVES TO VIEW BHARAT'S POWER.</div>
        </main>
    </div>

    <script>
        const database = {
            'war47': {
                title: "1947: DEFENDING THE VALLEY",
                text: "The 1947-48 war was Bharat's baptism by fire. Pakistan's 'Operation Gulmarg' involved 20,000 tribal raiders aiming to capture Srinagar. Major Somnath Sharma (PVC) became a legend when he saved the Srinagar airfield, the lifeline for Indian reinforcements. Outnumbered 7-to-1, his stand allowed India to land troops and secure the capital. This war proved Bharat would never let its borders be redrawn by force."
            },
            'war65': {
                title: "1965: THE PATTON GRAVEYARD",
                text: "During the 1965 war, Pakistan believed their superior American M48 Patton tanks would conquer Indian territory. At the Battle of Asal Uttar, Indian forces used the tall sugarcane fields to their advantage. CQMH Abdul Hamid destroyed three tanks with a single Jeep-mounted gun. India ended the battle with nearly 100 destroyed enemy tanks, turning the region into a graveyard known as 'Patton Nagar'."
            },
            'war71': {
                title: "1971: THE BLITZKRIEG OF THE EAST",
                text: "In just 13 days, Bharat changed the world map. Following 'Operation Trident', where the Indian Navy set Karachi Port on fire, the Army and IAF launched a combined strike. It ended with the surrender of 93,000 Pakistani soldiers—the largest surrender since WWII. Bharat liberated a new nation, Bangladesh, proving our status as the dominant power of South Asia."
            },
            'war99': {
                title: "1999: KARGIL HEIGHTS",
                text: "Operation Vijay was fought at 18,000 feet. Despite the enemy holding the high peaks, Indian soldiers like Captain Vikram Batra ('Shershah') and Captain Manoj Pandey performed superhuman feats. Climbing vertical cliffs in freezing cold, Bharat regained every inch of soil, proving our mastery in high-altitude warfare."
            },
            'dakait': {
                title: "LYARI DOSSIER: THE PROXY WAR",
                text: "Rehman Dakait was a kingpin in Karachi used by the Deep State for terror logistics. His network was a key link for arms smuggling into Bharat. Intelligence dossiers confirm that Bharat's agencies monitor these underworld-terror links to prevent future attacks, as showcased in the 2025 movie 'Dhurandhar'."
            },
            'samridh': {
                title: "OFFICER PROFILE: SAMRIDH KUMAR",
                text: "NAME: Samridh Kumar\nRANK: Class 7 Developer\nMISSION: Patriotism through Technology\nSamridh represents the future of Bharat—combining technical skills with a deep love for our military history. This Command Center is a tribute to the warriors who protect us."
            }
        };

        let typing = null;
        let sirenInterval = null;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // TACTICAL SIREN FUNCTION
        function playSiren() {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'sawtooth';
            // Oscillating frequency for that "WEE-WOO" effect
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.5);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function triggerRedAlert() {
            const body = document.getElementById('mainBody');
            const box = document.getElementById('countdown-box');
            const overlay = document.getElementById('alert-overlay');
            
            if(body.classList.contains('alert-active')) {
                // STOP ALERT
                body.classList.remove('alert-active');
                box.style.display = 'none';
                overlay.style.display = 'none';
                clearInterval(sirenInterval);
            } else {
                // START ALERT
                body.classList.add('alert-active');
                box.style.display = 'block';
                overlay.style.display = 'block';
                
                let time = 10;
                document.getElementById('timer').innerText = time;
                
                sirenInterval = setInterval(() => {
                    playSiren();
                    time--;
                    document.getElementById('timer').innerText = time;
                    if(time <= 0) {
                        clearInterval(sirenInterval);
                        location.reload(); // Purge system
                    }
                }, 1000);
            }
        }

        function startAnthem() {
            const melody = [440, 493, 523, 587, 587, 587, 587, 587, 523, 493, 440];
            let t = audioCtx.currentTime;
            melody.forEach(f => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.frequency.value = f;
                g.gain.value = 0.05;
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.4);
                t += 0.5;
            });
        }

        function loadIntel(key) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(event) event.target.classList.add('active');

            const data = database[key];
            document.getElementById('titleArea').innerText = data.title;
            const body = document.getElementById('bodyArea');
            
            if(typing) clearInterval(typing);
            body.innerText = "";
            let i = 0;
            typing = setInterval(() => {
                if(i < data.text.length) {
                    body.innerText += data.text.charAt(i); i++;
                    document.getElementById('mainScroll').scrollTop = document.getElementById('mainScroll').scrollHeight;
                } else { clearInterval(typing); }
            }, 10);
        }

        window.onload = () => loadIntel('war47');
    </script>
</body>
</html>
