<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHARAT COMMAND | FINAL STRIKE | SAMRIDH KUMAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --saffron: #FF9933;
            --neon-green: #39ff14;
            --alert-red: #ff0000;
            --deep-navy: #02040a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--deep-navy);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Red Alert Pulse */
        body.alert-active { animation: red-flash 0.4s infinite; }
        @keyframes red-flash {
            0% { background-color: var(--deep-navy); }
            50% { background-color: #500; }
            100% { background-color: var(--deep-navy); }
        }

        /* Screen Static Effect for "Destruction" */
        #static-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWUicG3Ze/giphy.gif');
            z-index: 20000; display: none; opacity: 0.8;
        }

        .header-nav {
            background: #000; padding: 15px 30px;
            border-bottom: 2px solid var(--neon-green);
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }

        #searchBox {
            width: 400px; background: #000; border: 1px solid var(--neon-green);
            color: var(--neon-green); padding: 10px; font-family: 'Orbitron'; outline: none;
        }

        .red-alert-btn {
            background: #600; color: white; border: 2px solid red;
            padding: 10px 25px; font-family: 'Orbitron'; cursor: pointer;
            box-shadow: 0 0 15px red; transition: 0.3s;
        }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        .sidebar { width: 250px; background: #000; border-right: 1px solid #222; }

        .tab-btn {
            width: 100%; padding: 20px; background: transparent; color: #444;
            border: none; text-align: left; font-family: 'Orbitron'; cursor: pointer;
            border-bottom: 1px solid #111;
        }

        .tab-btn.active { color: var(--neon-green); background: rgba(57, 255, 20, 0.1); border-left: 5px solid var(--neon-green); }

        .info-center { flex: 1; padding: 50px; overflow-y: auto; background: rgba(0,0,0,0.8); }

        .system-log {
            width: 300px; background: #000; border-left: 1px solid #222;
            padding: 10px; font-size: 0.75rem; display: flex; flex-direction: column-reverse; overflow: hidden;
        }

        .war-title { font-family: 'Cinzel'; font-size: 3.5rem; color: var(--saffron); margin-bottom: 20px; }
        .typewriter-text { font-size: 1.6rem; line-height: 1.8; color: var(--neon-green); white-space: pre-wrap; }

        #alert-overlay {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: white; background: red; padding: 20px 50px; font-size: 4rem;
            font-family: 'Orbitron'; z-index: 10000; display: none; text-align: center;
        }

        #countdown { color: yellow; font-size: 5rem; display: block; }

        .creator-tag { margin-top: 50px; border: 2px solid var(--neon-green); padding: 20px; display: inline-block; }
        .war-page { display: none; }
        .war-page.active { display: block; }
    </style>
</head>
<body>

    <div id="static-screen"></div>
    <div id="alert-overlay">
        SECURITY BREACH<br>
        <span id="countdown">10</span>
    </div>

    <div class="header-nav">
        <div style="font-family: 'Cinzel'; font-size: 1.3rem;">PROJECT: BHARAT_SHIELD</div>
        <input type="text" id="searchBox" placeholder="SEARCH DATABASE (e.g. 1971, Dakait)...">
        <button class="red-alert-btn" onclick="triggerRedAlert()">RED ALERT</button>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <button class="tab-btn active" onclick="showWar('war47')">1947 Clash</button>
            <button class="tab-btn" onclick="showWar('war65')">1965 Tank War</button>
            <button class="tab-btn" onclick="showWar('war71')">1971 Victory</button>
            <button class="tab-btn" onclick="showWar('war99')">1999 Kargil</button>
            <button class="tab-btn" onclick="showWar('mumbai')">26/11 Siege</button>
            <button class="tab-btn" onclick="showWar('dakait')">Lyari Files</button>
            <button class="tab-btn" onclick="showWar('final')">Jai Hind</button>
        </div>

        <div class="info-center" id="scrollArea">
            <div id="war47" class="war-page active" data-text="[DECRYPTION COMPLETE]&#10;&#10;1947: Major Somnath Sharma saved the Srinagar airfield. He stayed on the battlefield even when outnumbered. He is the pride of Bharat.">
                <h1 class="war-title">1947: FIRST WAR</h1>
                <div class="typewriter-text"></div>
            </div>
            <div id="dakait" class="war-page" data-text="[DECRYPTION COMPLETE]&#10;&#10;Rehman Dakait: The Karachi Underworld operative who funded terror logistics. Exposed in the 2025 movie 'Dhurandhar'. Intelligence confirms he was a proxy for anti-India forces.">
                <h1 class="war-title">REHMAN DAKAIT</h1>
                <div class="typewriter-text"></div>
            </div>
            <div id="final" class="war-page" data-text="[SYSTEM LOG: FINAL ENTRY]&#10;&#10;Jai Hind. Created by Samridh Kumar of Class 7. A tribute to the courage of the Indian Armed Forces.">
                <h1 class="war-title">JAI HIND</h1>
                <div class="typewriter-text"></div>
                <div class="creator-tag">
                    <h2>CREATED BY: SAMRIDH KUMAR</h2>
                    <p>CLASS 7 | BHARAT VIGILANCE OFFICER</p>
                </div>
            </div>
        </div>

        <div class="system-log" id="logPanel"></div>
    </div>

    <script>
        let typingInterval = null;
        let isAlerting = false;
        let count = 10;
        let countInterval = null;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSiren() {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.4);
            osc.connect(g); g.connect(audioCtx.destination);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }

        function triggerRedAlert() {
            isAlerting = !isAlerting;
            document.body.classList.toggle('alert-active');
            const overlay = document.getElementById('alert-overlay');
            overlay.style.display = isAlerting ? 'block' : 'none';
            
            if (isAlerting) {
                count = 10;
                document.getElementById('countdown').innerText = count;
                countInterval = setInterval(() => {
                    count--;
                    document.getElementById('countdown').innerText = count;
                    playSiren();
                    if(count <= 0) {
                        clearInterval(countInterval);
                        document.getElementById('static-screen').style.display = 'block';
                        setTimeout(() => location.reload(), 3000);
                    }
                }, 1000);
            } else {
                clearInterval(countInterval);
            }
        }

        function startType(container, text) {
            if (typingInterval) clearInterval(typingInterval);
            container.innerText = "";
            let i = 0;
            typingInterval = setInterval(() => {
                if (i < text.length) {
                    container.innerText += text.charAt(i); i++;
                    document.getElementById('scrollArea').scrollTop = document.getElementById('scrollArea').scrollHeight;
                } else { clearInterval(typingInterval); }
            }, 30);
        }

        function showWar(id) {
            document.querySelectorAll('.war-page').forEach(p => p.classList.remove('active'));
            const activePage = document.getElementById(id);
            activePage.classList.add('active');
            startType(activePage.querySelector('.typewriter-text'), activePage.getAttribute('data-text'));
        }

        document.getElementById('searchBox').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                const q = e.target.value.toLowerCase();
                if(q.includes('dakait')) showWar('dakait');
                else if(q.includes('hind')) showWar('final');
            }
        });

        window.onload = () => showWar('war47');
        setInterval(() => {
            const entry = document.createElement('div');
            entry.innerText = `> LOG_${Math.random().toString(16).substr(2, 5).toUpperCase()}...OK`;
            const panel = document.getElementById('logPanel');
            panel.prepend(entry);
            if(panel.children.length > 20) panel.lastChild.remove();
        }, 1200);
    </script>
</body>
</html>
