<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHARAT COMMAND | DYNAMIC EDITION | SAMRIDH KUMAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --saffron: #FF9933;
            --neon-green: #39ff14;
            --deep-navy: #02040a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--deep-navy);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-image 0.8s ease-in-out;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 40%;
        }

        /* Initial Background (Chakra) */
        .bg-chakra {
            background-image: linear-gradient(rgba(2, 4, 10, 0.94), rgba(2, 4, 10, 0.94)),
                              url('https://upload.wikimedia.org/wikipedia/commons/1/17/Ashoka_Chakra.svg');
        }

        /* Alternate Background (Flag) */
        .bg-flag {
            background-image: linear-gradient(rgba(2, 4, 10, 0.94), rgba(2, 4, 10, 0.94)),
                              url('https://upload.wikimedia.org/wikipedia/en/4/41/Flag_of_India.svg');
        }

        body.alert-active { animation: red-flash 0.4s infinite; }
        @keyframes red-flash { 0% { background-color: #000; } 50% { background-color: #400; } 100% { background-color: #000; } }

        .header {
            background: #000; padding: 20px 40px; border-bottom: 2px solid var(--neon-green);
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }

        #searchBox {
            width: 400px; background: #080808; border: 1px solid var(--neon-green);
            color: var(--neon-green); padding: 12px; font-family: 'Orbitron'; outline: none;
        }

        .main-ui { display: flex; flex: 1; overflow: hidden; }

        .sidebar { width: 280px; background: #000; border-right: 1px solid #222; }
        .tab-btn {
            width: 100%; padding: 25px 20px; background: transparent; color: #555;
            border: none; text-align: left; font-family: 'Orbitron'; cursor: pointer;
            border-bottom: 1px solid #111; transition: 0.3s;
        }
        .tab-btn.active { color: var(--neon-green); background: rgba(57, 255, 20, 0.1); border-left: 6px solid var(--neon-green); }

        .info-panel { flex: 1; padding: 60px; overflow-y: auto; background: rgba(0,0,0,0.85); z-index: 5; }
        .war-title { font-family: 'Cinzel'; font-size: 3.5rem; color: var(--saffron); margin-bottom: 20px; }
        .long-intel { font-size: 1.5rem; line-height: 1.9; color: var(--neon-green) !important; white-space: pre-wrap; text-align: justify; }

        .log-panel { width: 280px; background: #000; border-left: 1px solid #222; padding: 15px; font-size: 0.75rem; display: flex; flex-direction: column-reverse; overflow: hidden; opacity: 0.6; }
        
        #alert-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4rem; color: white; background: red; padding: 20px; display: none; z-index: 1000; font-family: 'Orbitron'; box-shadow: 0 0 50px red; }
    </style>
</head>
<body class="bg-chakra" id="mainBody">

    <div id="alert-msg">!! BREACH DETECTED !!</div>

    <div class="header">
        <div style="font-family: 'Cinzel'; font-size: 1.5rem; color: var(--neon-green);">BHARAT_COMMAND_CENTER</div>
        <input type="text" id="searchBox" placeholder="TYPE KEYWORD & PRESS ENTER...">
        <button style="background: #500; color: white; border: 1px solid red; padding: 10px; cursor: pointer;" onclick="toggleAlert()">RED ALERT</button>
    </div>

    <div class="main-ui">
        <div class="sidebar">
            <button class="tab-btn active" onclick="loadTab('war47', 0)">01. 1947 KASHMIR OPS</button>
            <button class="tab-btn" onclick="loadTab('war65', 1)">02. 1965 TANK BATTLE</button>
            <button class="tab-btn" onclick="loadTab('war71', 2)">03. 1971 LIBERATION</button>
            <button class="tab-btn" onclick="loadTab('war99', 3)">04. 1999 KARGIL VICTORY</button>
            <button class="tab-btn" onclick="loadTab('mumbai', 4)">05. 26/11 COUNTER-TERROR</button>
            <button class="tab-btn" onclick="loadTab('dakait', 5)">06. KARACHI UNDERWORLD</button>
            <button class="tab-btn" onclick="loadTab('final', 6)">07. JAI HIND / SAMRIDH</button>
        </div>

        <div class="info-panel" id="scrollArea">
            <h1 id="active-title" class="war-title">1947: THE FIRST DEFENSE</h1>
            <div id="typewriter-text" class="long-intel"></div>
            <div id="creator-info" style="display:none; margin-top: 50px; border: 2px solid var(--neon-green); padding: 20px;">
                <h2>DEVELOPER: SAMRIDH KUMAR</h2>
                <p>RANK: CLASS 7 STUDENT | FUTURE OF BHARAT</p>
            </div>
        </div>

        <div class="log-panel" id="logPanel"></div>
    </div>

    <script>
        const database = {
            'war47': { title: "1947: DEFENDING KASHMIR", text: "In 1947, Pakistan sent tribal invaders to capture Srinagar. The Indian Army responded with a legendary airlift. Major Somnath Sharma (PVC) became a symbol of eternal courage, holding his ground against hundreds of enemies to protect the airfield. \n\nBharat's power was proven in its ability to deploy troops mid-war and win back the valley." },
            'war65': { title: "1965: THE TANK GRAVEYARD", text: "The Battle of Asal Uttar remains the most famous tank battle in Indian history. The world thought Pakistan's Patton tanks were invincible. Bharat proved them wrong. CQMH Abdul Hamid destroyed 3 tanks with a single Jeep, stopping the enemy cold. \n\nToday, the site is known as Patton Nagar, a reminder of Indian bravery." },
            'war71': { title: "1971: BIRTH OF A NATION", text: "In 13 days, the Indian Armed Forces broke the back of the enemy. General Niazi surrendered with 93,000 troops—the largest surrender since WWII. India liberated Bangladesh and secured the title of the dominant force in the subcontinent. \n\nOperation Trident saw the Indian Navy paralyze the Karachi port, showing the world our maritime strength." },
            'war99': { title: "1999: THE KARGIL WAR", text: "Operation Vijay was fought at the highest battlefields on Earth. Men like Capt Vikram Batra captured Tiger Hill, proving that no mountain is too high for an Indian soldier. Even in freezing cold and vertical cliffs, Bharat regained every inch of its territory." },
            'mumbai': { title: "26/11: THE MUMBAI SIEGE", text: "The 26/11 attacks were meant to break our spirit. Instead, they made us stronger. Heroes like Tukaram Omble ensured Kasab was caught alive, exposing the Pakistani state-sponsored terror network. Major Sandeep Unnikrishnan saved lives at the Taj, dying so others could live." },
            'dakait': { title: "LYARI: THE DARK NEXUS", text: "Rehman Dakait was the underworld kingpin of Karachi, acting as a logistical bridge for anti-India terrorists. His neutralization in 2009 was a blow to the terror ecosystem. Movies like 'Dhurandhar' (2025) now show the secret operations that keep Bharat safe from such threats." },
            'final': { title: "JAI HIND: BHARAT FIRST", text: "India is now a global superpower—ranked 4th in military strength, a leader in Space (ISRO), and a global technology hub. This portal is a tribute to the warriors of the soil. \n\nJai Hind! Jai Bharat!" }
        };

        let typingInterval = null;

        function loadTab(key, index) {
            // Update Tab Highlight
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(b => b.classList.remove('active'));
            btns[index].classList.add('active');

            // 1. DYNAMIC BACKGROUND CHANGE
            const body = document.getElementById('mainBody');
            if (index % 2 === 0) {
                body.className = 'bg-chakra';
            } else {
                body.className = 'bg-flag';
            }

            // Update Text with Typewriter
            const data = database[key];
            document.getElementById('active-title').innerText = data.title;
            const container = document.getElementById('typewriter-text');
            const creator = document.getElementById('creator-info');
            
            creator.style.display = (key === 'final') ? 'block' : 'none';

            if (typingInterval) clearInterval(typingInterval);
            container.innerText = "";
            let i = 0;
            typingInterval = setInterval(() => {
                if (i < data.text.length) {
                    container.innerText += data.text.charAt(i);
                    i++;
                    document.getElementById('scrollArea').scrollTop = document.getElementById('scrollArea').scrollHeight;
                } else { clearInterval(typingInterval); }
            }, 15);
        }

        function toggleAlert() {
            document.body.classList.toggle('alert-active');
            const msg = document.getElementById('alert-msg');
            msg.style.display = (msg.style.display === 'block') ? 'none' : 'block';
        }

        // Initial Load
        window.onload = () => loadTab('war47', 0);

        // Auto-Logs
        setInterval(() => {
            const entry = document.createElement('div');
            entry.innerText = `> ${['DATA_LINK_ON', 'ENCRYPT_REHMAN', 'SCAN_PK_BORDER'][Math.floor(Math.random()*3)]}... OK`;
            const panel = document.getElementById('logPanel');
            panel.prepend(entry);
            if(panel.children.length > 20) panel.lastChild.remove();
        }, 1500);

    </script>
</body>
</html>
