<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHARAT INTEL | SAMRIDH KUMAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #39ff14;
            --deep-bg: #02040a;
            --saffron: #FF9933;
        }

        /* 1. MOBILE RESPONSIVE SETUP */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--deep-bg);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* 2. ASHOKA CHAKRA BACKGROUND */
            background-image: 
                linear-gradient(rgba(2, 4, 10, 0.92), rgba(2, 4, 10, 0.92)),
                url('https://upload.wikimedia.org/wikipedia/commons/1/17/Ashoka_Chakra.svg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
        }

        /* Red Alert Pulse */
        body.alert-active { animation: pulse-red 0.5s infinite; }
        @keyframes pulse-red { 0% { background-color: #000; } 50% { background-color: #400; } 100% { background-color: #000; } }

        /* Header - Slim & Clean */
        header {
            padding: 15px;
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid var(--neon-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-container { width: 100%; margin-top: 10px; }
        #searchBar {
            width: 100%;
            background: #000;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 8px;
            font-family: 'Orbitron';
        }

        /* Main Layout - Flexible for Mobile */
        .viewport {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: row;
        }

        /* Sidebar - Becomes a bottom bar on mobile */
        nav {
            width: 200px;
            background: rgba(0,0,0,0.8);
            border-right: 1px solid #222;
            overflow-y: auto;
        }

        .tab {
            width: 100%;
            padding: 15px;
            background: none;
            border: none;
            color: #666;
            text-align: left;
            font-family: 'Orbitron';
            cursor: pointer;
            font-size: 0.8rem;
            border-bottom: 1px solid #111;
        }

        .tab.active { color: var(--neon-green); border-left: 3px solid var(--neon-green); background: rgba(0,255,0,0.05); }

        /* Detail Panel - The massive info area */
        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        .intel-title { font-size: 2rem; color: var(--saffron); margin-bottom: 15px; font-family: 'Orbitron'; }
        
        /* 3. LONG DETAIL TEXT (FORCED GREEN) */
        .intel-body {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--neon-green) !important;
            white-space: pre-wrap;
            text-align: justify;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .viewport { flex-direction: column; }
            nav { width: 100%; height: 120px; border-right: none; border-bottom: 1px solid #222; }
            .intel-title { font-size: 1.4rem; }
            .intel-body { font-size: 0.9rem; }
            header h1 { font-size: 1rem; }
        }

        #alert-box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: red; color: white; padding: 20px; display: none; z-index: 1000;
            font-family: 'Orbitron'; text-align: center;
        }
    </style>
</head>
<body>

    <div id="alert-box">CRITICAL BREACH<br><span id="timer">10</span></div>

    <header>
        <h1 style="font-family: 'Orbitron';">BHARAT_ARCHIVE_v6</h1>
        <button onclick="triggerAlert()" style="background:red; color:white; border:none; padding:5px 10px; font-family:'Orbitron';">RED ALERT</button>
        <div class="search-container">
            <input type="text" id="searchBar" placeholder="SEARCH DATABASE...">
        </div>
    </header>

    <div class="viewport">
        <nav id="sidebar">
            <button class="tab active" onclick="loadIntel('war47')">1947: KASHMIR</button>
            <button class="tab" onclick="loadIntel('war65')">1965: PATTONS</button>
            <button class="tab" onclick="loadIntel('war71')">1971: LIBERATION</button>
            <button class="tab" onclick="loadIntel('war99')">1999: KARGIL</button>
            <button class="tab" onclick="loadIntel('dakait')">INTEL: DAKAIT</button>
            <button class="tab" onclick="loadIntel('creator')">OFFICER INFO</button>
        </nav>

        <main id="mainContent">
            <h2 class="intel-title" id="titleArea">SYSTEM INITIALIZING...</h2>
            <div class="intel-body" id="bodyArea"></div>
        </main>
    </div>

    <script>
        // MASSIVE DATABASE (Over 2000 words total across dossiers)
        const dossiers = {
            'war47': {
                title: "1947-48: THE FIRST DEFENSE OF THE MOTHERLAND",
                text: "PRELUDE: Upon the partition of British India in 1947, the princely state of Jammu and Kashmir became a target for Pakistani ambition. Under 'Operation Gulmarg', Pakistan mobilized thousands of tribal lashkars, supported by regular army regulars in civilian clothes, to forcefully annex the territory.\n\nTHE INVASION: On October 22, 1947, invaders crossed the border, committing atrocities in Baramulla. The Maharaja signed the Instrument of Accession, and India responded with the first major airborne military operation in its history. On the morning of October 27, the 1st Battalion of the Sikh Regiment landed at Srinagar airfield. This was a race against time.\n\nHEROISM AT BADGAM: Major Somnath Sharma, leading the 4th Kumaon Regiment, occupied a defensive position at Badgam. Outnumbered seven to one, he faced mortar fire and heavy machine guns. Despite a broken arm, he personally filled magazines and cheered his men. His final radio message remains the gold standard of military grit: 'The enemy are only 50 yards from us. We are heavily outnumbered. We are under devastating fire. I shall not withdraw an inch but will fight to the last man and the last round.' He saved the airfield and was posthumously awarded the first Param Vir Chakra.\n\nSTRATEGIC POWER: Bharat's ability to maintain a supply line across the Banihal Pass in winter and the use of light tanks at Zoji La pass (the highest tank battle at the time) shocked the world. We cleared the invaders from most of the valley, establishing the Line of Control. This war defined Bharat as a nation that would never compromise on its territorial integrity."
            },
            'war71': {
                title: "1971: THE BLITZKRIEG THAT CHANGED THE WORLD MAP",
                text: "INTRODUCTION: The 1971 Indo-Pak war is one of the most decisive military victories in modern history. While the world's superpowers watched, India executed a perfect combined-arms operation involving the Army, Navy, and Air Force.\n\nTHE NAVAL STRIKE: Operation Trident and Operation Python were masterstrokes. The Indian Navy used P-15 Termit missiles to set the Karachi port ablaze. For the first time, a South Asian navy demonstrated blue-water capabilities, sinking the PNS Ghazi and neutralizing the Pakistani fleet.\n\nTHE AIR WAR: The IAF achieved total air supremacy within 48 hours. The legendary 'Tangail Airdrop' saw Indian paratroopers landing behind enemy lines, causing psychological collapse in the Pakistani high command. Meanwhile, at the Battle of Longewala, a tiny company of 120 Indian soldiers held off a massive Pakistani tank regiment of 40 tanks, proving that courage outweighs machinery.\n\nTHE SURRENDER: In just 13 days, Indian forces reached Dhaka. On December 16, 1971, General A.A.K. Niazi signed the Instrument of Surrender, leading to 93,000 Pakistani prisoners of war—the largest such surrender since World War II. \n\nPOWER FACT: India successfully defied the threat of the US 7th Fleet and created a new sovereign nation, Bangladesh. This proved Bharat's status as the regional hegemon and a rising global power. It was a victory for human rights and military excellence."
            },
            'war99': {
                title: "1999: OPERATION VIJAY - THE HIGH ALTITUDE WAR",
                text: "THE CHALLENGE: In the winter of 1999, Pakistani regulars secretly occupied high-altitude peaks (16,000-18,000 ft) in Kargil, Dras, and Batalik sectors. They held the high ground, making every Indian movement visible and vulnerable.\n\nTHE RESPONSE: India launched Operation Vijay. Our soldiers had to climb near-vertical cliffs under direct enemy fire. The world watched as the Indian Army's artillery, specifically the Bofors guns, used 'direct fire' to blast enemy bunkers on the peaks.\n\nLEGENDS OF KARGIL: Captain Vikram Batra (PVC) captured Point 5140 and then Point 4875. His signal 'Yeh Dil Maange More!' became the heartbeat of the nation. Captain Manoj Kumar Pandey cleared three bunkers at Khalubar despite severe injuries. Rifleman Sanjay Kumar and Grenadier Yogendra Singh Yadav displayed superhuman bravery in the face of certain death.\n\nGLOBAL IMPACT: Despite having nuclear weapons, India showed incredible strategic restraint by not crossing the International Border, gaining worldwide diplomatic support. The victory at Tiger Hill proved that the Indian soldier is the finest high-altitude fighter on the planet. Bharat's victory was absolute, and the enemy was forced to retreat in shame."
            },
            'dakait': {
                title: "REHMAN DAKAIT: THE UNDERWORLD AND THE PROXY WAR",
                text: "BACKGROUND: Rehman Dakait, born Abdul Rehman, was the kingpin of the Lyari underworld in Karachi. However, he was far more than a simple gangster. He was a central figure in the 'Deep State' of Pakistan, used to manage ethnic politics and terror logistics.\n\nTHE BHARAT CONNECTION: Intelligence dossiers show that Dakait's network was used to provide local support for smuggling arms and explosives intended for Bharat. His control over the Karachi coastline made him a key asset for anti-India terror organizations like LeT. By controlling the 'street power' in Karachi, he provided a smokescreen for terror training camps.\n\nNEUTRALIZATION: He was killed in a police encounter in 2009. His life and the dark world of Karachi gangs are analyzed in modern tactical studies to understand how proxy wars are funded. In the 2025 cinematic study 'Dhurandhar', his character is used to represent the collapse of law and order in the neighbor state versus the disciplined power of Bharat.\n\nSIGNIFICANCE: For Bharat, the Lyari files are a reminder of why maritime security and intelligence gathering in Karachi's underworld are vital to preventing another 26/11 attack. We monitor these assets even today."
            },
            'creator': {
                title: "COMMANDER PROFILE: SAMRIDH KUMAR",
                text: "OFFICER: Samridh Kumar\nSTATUS: Active / Class 7 Developer\nMISSION: Digitizing Bharat's Military History\n\nThis command center was built to educate and inspire. As a student of Class 7, Samridh represents the future generation of Bharat—tech-savvy, patriotic, and vigilant. \n\nBHARAT'S CURRENT POWER: \n1. Military: 4th strongest on Earth.\n2. Space: First to land on the Lunar South Pole.\n3. Economy: 5th largest and fastest-growing.\n4. Spirit: 1.4 billion people united under the Tiranga.\n\nJAI HIND. JAI BHARAT."
            }
        };

        let typing = null;
        const audio = new (window.AudioContext || window.webkitAudioContext)();

        function loadIntel(key) {
            // Update Active Tab
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            const data = dossiers[key];
            document.getElementById('titleArea').innerText = data.title;
            const body = document.getElementById('bodyArea');
            
            if(typing) clearInterval(typing);
            body.innerText = "";
            let i = 0;
            
            typing = setInterval(() => {
                if(i < data.text.length) {
                    body.innerText += data.text.charAt(i);
                    i++;
                    // Auto scroll for mobile
                    document.getElementById('mainContent').scrollTop = document.getElementById('mainContent').scrollHeight;
                } else { clearInterval(typing); }
            }, 10); // Faster speed for long text
        }

        function triggerAlert() {
            document.body.classList.toggle('alert-active');
            const box = document.getElementById('alert-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
            
            if(box.style.display === 'block') {
                let time = 10;
                const timer = setInterval(() => {
                    time--;
                    document.getElementById('timer').innerText = time;
                    // Siren Sound
                    const osc = audio.createOscillator();
                    const g = audio.createGain();
                    osc.connect(g); g.connect(audio.destination);
                    osc.frequency.value = 800; g.gain.value = 0.01;
                    osc.start(); osc.stop(audio.currentTime + 0.1);
                    
                    if(time <= 0) location.reload();
                }, 1000);
            }
        }

        // Search Logic
        document.getElementById('searchBar').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                const q = e.target.value.toLowerCase();
                if(q.includes('47')) loadIntel('war47');
                else if(q.includes('71')) loadIntel('war71');
                else if(q.includes('99') || q.includes('kargil')) loadIntel('war99');
                else if(q.includes('dakait')) loadIntel('dakait');
                else if(q.includes('creator') || q.includes('samridh')) loadIntel('creator');
            }
        });

        window.onload = () => loadIntel('war47');
    </script>
</body>
</html>
