<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BHARAT_COMMAND_V15 | SAMRIDH KUMAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #39ff14;
            --deep-bg: #010206;
            --saffron: #FF9933;
            --alert-red: #ff0000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--deep-bg);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            background-image: 
                linear-gradient(rgba(1, 2, 6, 0.97), rgba(1, 2, 6, 0.97)),
                url('https://upload.wikimedia.org/wikipedia/commons/1/17/Ashoka_Chakra.svg');
            background-repeat: no-repeat; background-position: center; background-size: 50%;
        }

        body.alert-active { animation: pulse-red 0.4s infinite; }
        @keyframes pulse-red { 0% { background-color: #000; } 50% { background-color: #500; } 100% { background-color: #000; } }

        header {
            padding: 15px 30px; background: rgba(0,0,0,0.98);
            border-bottom: 2px solid var(--neon-green);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }

        .viewport { display: flex; flex: 1; overflow: hidden; }

        nav {
            width: 320px; background: rgba(0,0,0,0.95);
            border-right: 1px solid #333; display: flex; flex-direction: column;
        }

        .search-container { padding: 15px; border-bottom: 1px solid #222; }
        #intelSearch {
            width: 100%; padding: 10px; background: #111; border: 1px solid var(--neon-green);
            color: var(--neon-green); font-family: 'Share Tech Mono'; outline: none;
        }

        .nav-list { flex: 1; overflow-y: auto; }

        .tab {
            width: 100%; padding: 20px 15px; background: none; border: none;
            color: #666; text-align: left; font-family: 'Orbitron';
            cursor: pointer; font-size: 0.8rem; border-bottom: 1px solid #111;
        }

        .tab.active { color: var(--neon-green); background: rgba(57, 255, 20, 0.1); border-left: 6px solid var(--neon-green); }

        .red-alert-container { padding: 15px; border-top: 1px solid #222; }
        .alert-btn {
            width: 100%; padding: 12px; font-family: 'Orbitron'; font-size: 0.8rem;
            cursor: pointer; border: 2px solid white; font-weight: bold;
            background: var(--alert-red); color: white; box-shadow: 0 0 15px var(--alert-red);
        }

        main { flex: 1; padding: 40px; overflow-y: auto; position: relative; scrollbar-width: thin; }
        .intel-title { font-size: 2.2rem; color: var(--saffron); margin-bottom: 20px; font-family: 'Cinzel'; }
        .intel-body { font-size: 1.2rem; line-height: 2; color: var(--neon-green) !important; white-space: pre-wrap; text-align: justify; padding-bottom: 100px; }

        @media (max-width: 800px) {
            .viewport { flex-direction: column; }
            nav { width: 100%; height: auto; border-right: none; border-bottom: 1px solid #333; }
            .nav-list { display: flex; overflow-x: auto; }
            .tab { width: auto; white-space: nowrap; border-bottom: none; border-right: 1px solid #222; padding: 15px 20px; }
            .search-container, .red-alert-container { padding: 10px; }
            .intel-title { font-size: 1.6rem; }
        }

        #alert-overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(150, 0, 0, 0.95); color: white; padding: 40px; border: 6px double white;
            text-align: center; font-family: 'Orbitron'; z-index: 2000; display: none; width: 85%;
            box-shadow: 0 0 50px red;
        }
    </style>
</head>
<body id="mainBody">

    <div id="alert-overlay">
        <h1 style="font-size: 2rem; margin-bottom: 10px;">SYSTEM PURGE INITIATED</h1>
        <p style="margin-bottom: 20px;">SECURITY CLEARANCE REVOKED</p>
        <h1 id="timer" style="font-size: 5rem; text-shadow: 0 0 20px white;">10</h1>
    </div>

    <header>
        <div style="font-family: 'Cinzel'; font-size: 1.8rem; color: white; letter-spacing: 2px;">BHARAT_COMMAND_FORTRESS</div>
    </header>

    <div class="viewport">
        <nav id="sidebar">
            <div class="search-container">
                <input type="text" id="intelSearch" placeholder="SEARCH DOSSIERS..." onkeyup="filterIntel()">
            </div>
            
            <div class="nav-list" id="navList">
                <button class="tab active" onclick="loadIntel('war47')">01. 1947 KASHMIR OPS</button>
                <button class="tab" onclick="loadIntel('war65')">02. 1965 TANK BATTLES</button>
                <button class="tab" onclick="loadIntel('war71')">03. 1971 LIBERATION</button>
                <button class="tab" onclick="loadIntel('war99')">04. 1999 KARGIL WAR</button>
                <button class="tab" onclick="loadIntel('dakait')">05. DAKAIT INTEL FILES</button>
                <button class="tab" onclick="loadIntel('power')">06. GLOBAL POWER STATUS</button>
                <button class="tab" onclick="loadIntel('samridh')">07. COMMANDER PROFILE</button>
            </div>

            <div class="red-alert-container">
                <button class="alert-btn" onclick="triggerAlert()">RED ALERT</button>
            </div>
        </nav>

        <main id="mainArea">
            <h2 class="intel-title" id="titleArea">SYSTEM_INITIALIZING...</h2>
            <div class="intel-body" id="bodyArea"></div>
        </main>
    </div>

    <script>
        // MASSIVE INTEL DATABASE REMAINS SAME
        const database = {
            'war47': { title: "1947-48: THE INDO-PAK KASHMIR CONFLICT", text: "DOSSIER ID: 1947-KASHMIR-ALPHA\n\n[STRATEGIC OVERVIEW]\nFollowing the partition of Bharat, the princely state of Jammu and Kashmir became a target for Pakistani aggression. Under the guise of a 'tribal rebellion,' the Pakistani military launched 'Operation Gulmarg.' Over 20,000 armed invaders infiltrated the valley, aiming to capture Srinagar and force the Maharaja's hand. This conflict marked the first time the Indian Army fought in high-altitude terrain post-independence.\n\n[THE HEROES OF BADGAM]\nOn October 27, 1947, Bharat airlifted the 1st Sikh Regiment into Srinagar just hours before the invaders reached the airport. Major Somnath Sharma, leading the 4th Kumaon, was tasked with defending the Badgam sector. Outnumbered seven-to-one, Major Sharma directed fire even while his arm was in a cast. His final message to Brigade HQ: 'The enemy is only 50 yards from us. I shall not withdraw an inch but will fight to the last man and the last round.' He saved the Srinagar airfield, the only link to the rest of India, and became the first recipient of the Param Vir Chakra." },
            'war65': { title: "1965: THE ASHES OF THE PATTON TANKS", text: "DOSSIER ID: 1965-BRAVO-TANK-WAR\n\n[ASAL UTTAR: THE FITTING REPLY]\nAt Khem Karan, Indian commanders executed a brilliant masterstroke. They flooded the sugarcane fields at night, turning the plains into a sticky, deep swamp. When the Pakistani 1st Armoured Division advanced, their heavy Pattons got bogged down in the mud. Indian infantry and tanks, hidden in the tall sugarcane, launched a devastating ambush. Company Quartermaster Havildar Abdul Hamid destroyed multiple Patton tanks single-handedly with a recoilless gun before his sacrifice." },
            'war71': { title: "1971: THE BLITZKRIEG THAT CHANGED THE WORLD", text: "DOSSIER ID: 1971-CHARLIE-VICTORY\n\n[OPERATION TRIDENT]\nOn December 4, the Indian Navy performed a daring raid on Karachi Harbor. Using missile boats, Bharat sank the PNS Khaibar and PNS Shah Jahan, setting the Karachi oil reserves on fire. This strike crippled the Pakistani Navy and ensured Bharat’s total control over the Arabian Sea. On December 16, 1971, General A.A.K. Niazi of Pakistan signed the Instrument of Surrender in front of General Jagjit Singh Aurora. 93,000 Pakistani soldiers surrendered—the largest military surrender since WWII." },
            'war99': { title: "1999: KARGIL - WAR AT THE TOP OF THE WORLD", text: "DOSSIER ID: 1999-DELTA-VIJAY\n\n[THE HEROES]\nCaptain Vikram Batra (Sher Shah) became a household name for his bravery at Point 5140 and Point 4875. His victory cry 'Yeh Dil Maange More!' echoed across the nation. Captain Manoj Pandey cleared four bunkers at Khalubar before his martyrdom. Bharat reclaimed every single peak, proving once again that the Indian Infantry is the most lethal mountain fighting force in existence." },
            'dakait': { title: "INTEL: THE SHADOW WAR & PROXY NETWORKS", text: "DOSSIER ID: SHADOW-EPSILON-DAKAIT\n\n[OPERATIONAL ANALYSIS]\nIntelligence reports highlight how underworld networks are utilized by state actors to fund and execute 'death by a thousand cuts' strategies. Bharat’s response, involving deep-cover intelligence and surgical strikes, has disrupted these pathways. The movie 'Dhurandhar' (2025) depicts the sophisticated technology and brave officers who work in the shadows to neutralize these networks." },
            'power': { title: "BHARAT: GLOBAL SUPERPOWER STATUS 2026", text: "DOSSIER ID: POWER-REPORT-2026\n\n[STRENGTH]\nBharat is currently the 4th most powerful military on Earth. We operate a nuclear triad, meaning we can launch nuclear defenses from land, air, and sea. With Chandrayaan-3 reaching the Lunar South Pole and the upcoming Gaganyaan mission, Bharat is a global leader in space exploration." },
            'samridh': { title: "COMMANDER PROFILE: SAMRIDH KUMAR", text: "NAME: Samridh Kumar\nRANK: Class 7 Developer & Strategic Archivist\n\n[MISSION LOG]\nCommander Samridh has developed this Command Center to ensure that the history of Bharat's victories is preserved with extreme detail. He believes that knowledge is the ultimate weapon in the digital age." }
        };

        let typing = null;

        function loadIntel(key) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(event && event.target.classList.contains('tab')) event.target.classList.add('active');

            const data = database[key];
            document.getElementById('titleArea').innerText = data.title;
            const bodyText = document.getElementById('bodyArea');
            if(typing) clearInterval(typing);
            bodyText.innerText = "";
            let i = 0;
            typing = setInterval(() => {
                if(i < data.text.length) { bodyText.innerText += data.text.charAt(i); i++; } 
                else { clearInterval(typing); }
            }, 3); 
        }

        function filterIntel() {
            let input = document.getElementById('intelSearch').value.toUpperCase();
            let tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                let txt = tab.innerText.toUpperCase();
                tab.style.display = txt.includes(input) ? "" : "none";
            });
        }

        // BEEPING LOGIC - FIXED
        function triggerAlert() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            function playBeep() {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'square'; osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            }

            document.getElementById('mainBody').classList.add('alert-active');
            document.getElementById('alert-overlay').style.display = 'block';
            
            let count = 10;
            document.getElementById('timer').innerText = count;
            playBeep(); 

            const countdown = setInterval(() => {
                count--;
                if (count >= 0) {
                    document.getElementById('timer').innerText = count;
                    playBeep();
                }
                if (count <= 0) {
                    clearInterval(countdown);
                    setTimeout(() => { location.reload(); }, 1000);
                }
            }, 1000);
        }

        window.onload = () => loadIntel('war47');
    </script>
</body>
</html>
