<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BHARAT_COMMAND_FORTRESS | SAMRIDH KUMAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #39ff14;
            --deep-bg: #010206;
            --saffron: #FF9933;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--deep-bg);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(1, 2, 6, 0.97), rgba(1, 2, 6, 0.97)),
                url('https://upload.wikimedia.org/wikipedia/commons/1/17/Ashoka_Chakra.svg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 50%;
        }

        body.alert-active { animation: pulse-red 0.5s infinite; }
        @keyframes pulse-red { 0% { background-color: #000; } 50% { background-color: #700; } 100% { background-color: #000; } }

        header {
            padding: 15px 25px;
            background: rgba(0,0,0,0.98);
            border-bottom: 2px solid var(--neon-green);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
        }

        .action-btn {
            padding: 10px 20px; font-family: 'Orbitron'; font-size: 0.8rem;
            cursor: pointer; border: 2px solid white; font-weight: bold;
            background: #ff0000; color: white; box-shadow: 0 0 10px red;
        }

        .viewport { display: flex; flex: 1; overflow: hidden; }

        /* DESKTOP SIDEBAR */
        nav {
            width: 280px; background: rgba(0,0,0,0.95);
            border-right: 1px solid #333; overflow-y: auto;
        }

        .tab {
            width: 100%; padding: 25px 20px; background: none; border: none;
            color: #555; text-align: left; font-family: 'Orbitron';
            cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid #222;
            transition: 0.3s;
        }

        .tab.active { color: var(--neon-green); background: rgba(57, 255, 20, 0.1); border-left: 8px solid var(--neon-green); }

        main { flex: 1; padding: 40px; overflow-y: auto; position: relative; scrollbar-width: thin; }
        .intel-title { font-size: 2.5rem; color: var(--saffron); margin-bottom: 25px; font-family: 'Cinzel'; }
        .intel-body { font-size: 1.25rem; line-height: 2; color: var(--neon-green) !important; white-space: pre-wrap; text-align: justify; padding-bottom: 150px; }

        /* RESPONSIVE DESIGN FOR MOBILE */
        @media (max-width: 800px) {
            .viewport { flex-direction: column; }
            nav { 
                width: 100%; height: auto; border-right: none; 
                border-bottom: 1px solid #333; display: flex; overflow-x: auto; 
            }
            .tab { 
                width: auto; white-space: nowrap; padding: 15px 20px; 
                border-bottom: none; border-right: 1px solid #222; 
            }
            .tab.active { border-left: none; border-bottom: 4px solid var(--neon-green); }
            .intel-title { font-size: 1.6rem; }
            .intel-body { font-size: 1.1rem; padding-bottom: 100px; }
            main { padding: 25px; }
            header { padding: 10px 15px; }
            header div { font-size: 1.1rem !important; }
        }

        #alert-box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: red; color: white; padding: 40px; border: 6px solid white;
            text-align: center; font-family: 'Orbitron'; z-index: 2000; display: none;
            width: 85%;
        }
    </style>
</head>
<body id="mainBody">

    <div id="alert-box">
        <h1 style="font-size: 2rem;">REBOOTING...</h1>
        <h1 id="timer" style="font-size: 4rem;">10</h1>
    </div>

    <header>
        <div style="font-family: 'Cinzel'; font-size: 1.6rem; color: white;">BHARAT_COMMAND_FORTRESS</div>
        <button class="action-btn" onclick="triggerAlert()">RED ALERT</button>
    </header>

    <div class="viewport">
        <nav id="sidebar">
            <button class="tab active" onclick="loadIntel('war47')">01. 1947 KASHMIR</button>
            <button class="tab" onclick="loadIntel('war65')">02. 1965 TANKS</button>
            <button class="tab" onclick="loadIntel('war71')">03. 1971 VICTORY</button>
            <button class="tab" onclick="loadIntel('war99')">04. 1999 KARGIL</button>
            <button class="tab" onclick="loadIntel('dakait')">05. DAKAIT FILES</button>
            <button class="tab" onclick="loadIntel('power')">06. GLOBAL POWER</button>
            <button class="tab" onclick="loadIntel('samridh')">07. COMMANDER</button>
        </nav>

        <main id="mainArea">
            <h2 class="intel-title" id="titleArea">SYSTEM_INITIALIZING...</h2>
            <div class="intel-body" id="bodyArea"></div>
        </main>
    </div>

    <script>
        // Massive Intel Database (Detailed for Samridh)
        const database = {
            'war47': {
                title: "1947: THE FIRST DEFENSE",
                text: "DOSSIER ID: 1947-KASHMIR-OPS\n\n[CONTEXT]\nPakistan launched 'Operation Gulmarg' using tribal invaders to seize Srinagar. This was Bharat's first test as a sovereign nation.\n\n[ACTION]\nMajor Somnath Sharma (PVC) held the Srinagar airfield against 700 invaders with only 50 men. His bravery ensured that Indian reinforcements could land. Without this airfield, the history of Kashmir would have been different.\n\n[LEGACY]\nIndia cleared the valley through the first-ever high-altitude tank operation at Zoji La. Bharat proved it could defend its territory from day one."
            },
            'war65': {
                title: "1965: GRAVEYARD OF PATTONS",
                text: "DOSSIER ID: 1965-TANK-WAR\n\n[STRATEGY]\nPakistan attacked with Patton tanks (US-made). India lured them into the flooded sugarcane fields of Khem Karan (Battle of Asal Uttar).\n\n[VICTORY]\nCQMH Abdul Hamid destroyed multiple tanks with a Jeep-mounted recoilless gun. Pakistan lost nearly 100 tanks. The area is still called 'Patton Nagar'. Bharat's tactical brilliance overcame the enemy's superior technology."
            },
            'war71': {
                title: "1971: THE DHAKA BLITZKRIEG",
                text: "DOSSIER ID: 1971-LIBERATION\n\n[VICTORY]\nField Marshal Sam Manekshaw led a 13-day war that redrew the world map. The Indian Navy set Karachi Port on fire in 'Operation Trident'.\n\n[RESULT]\n93,000 Pakistani soldiers surrendered in Dhaka. It was the largest military surrender since WWII. Bharat liberated Bangladesh and established undisputed regional dominance."
            },
            'war99': {
                title: "1999: KARGIL HEIGHTS",
                text: "DOSSIER ID: 1999-VIJAY\n\n[HEROISM]\nCapt. Vikram Batra (PVC) and Capt. Manoj Pandey led the charge at 18,000 feet. Indian soldiers climbed vertical cliffs under machine-gun fire to reclaim every peak.\n\n[POWER]\nThe world watched as Bharat used Bofors artillery and IAF Mirage 2000s to dismantle the enemy in the toughest terrain on Earth. Jai Hind."
            },
            'dakait': {
                title: "INTEL: LYARI PROXY FILES",
                text: "DOSSIER ID: UNDERWORLD-PROXY\n\n[DETAILS]\nRehman Dakait was a key logistical link for anti-Bharat proxies in Karachi. By neutralizing such networks, Bharat ensures that shadow wars are won before they reach the border. The movie 'Dhurandhar' (2025) depicts this proactive defense of the nation."
            },
            'power': {
                title: "BHARAT: GLOBAL POWER 2026",
                text: "STATUS: SUPERPOWER\n\n[STRENGTHS]\n1. Military: 4th strongest with a Nuclear Triad.\n2. Space: Chandrayaan-3 (South Pole landing) and Gaganyaan.\n3. Economy: 5th largest and fastest growing.\n\nBharat is the protector of the Indian Ocean and a symbol of democratic strength."
            },
            'samridh': {
                title: "COMMANDER PROFILE",
                text: "NAME: Samridh Kumar\nRANK: Class 7 Developer & Digital Guardian\n\n[LOG]\nCommander Samridh has built this portal to show the world that Bharat's history is one of courage and victory. No changes required. System is at 100% capacity."
            }
        };

        let typing = null;

        function loadIntel(key) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(event) event.target.classList.add('active');

            const data = database[key];
            document.getElementById('titleArea').innerText = data.title;
            const body = document.getElementById('bodyArea');
            
            if(typing) clearInterval(typing);
            body.innerText = "";
            let i = 0;
            
            typing = setInterval(() => {
                if(i < data.text.length) {
                    body.innerText += data.text.charAt(i); i++;
                } else { clearInterval(typing); }
            }, 3); 
        }

        function triggerAlert() {
            const body = document.getElementById('mainBody');
            const box = document.getElementById('alert-box');
            body.classList.add('alert-active');
            box.style.display = 'block';
            let count = 10;
            const timer = setInterval(() => {
                count--;
                document.getElementById('timer').innerText = count;
                if(count <= 0) { location.reload(); }
            }, 1000);
        }

        window.onload = () => loadIntel('war47');
    </script>
</body>
</html>
