<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHARAT_COMMAND_FINAL | SAMRIDH KUMAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #39ff14;
            --deep-bg: #010206;
            --saffron: #FF9933;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--deep-bg);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(1, 2, 6, 0.95), rgba(1, 2, 6, 0.95)),
                url('https://upload.wikimedia.org/wikipedia/commons/1/17/Ashoka_Chakra.svg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 50%;
        }

        body.alert-active { animation: pulse-red 0.5s infinite; }
        @keyframes pulse-red { 0% { background-color: #000; } 50% { background-color: #600; } 100% { background-color: #000; } }

        header {
            padding: 15px 30px;
            background: rgba(0,0,0,0.98);
            border-bottom: 2px solid var(--neon-green);
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; z-index: 1000;
        }

        .btn-group { display: flex; gap: 15px; align-items: center; }
        
        .action-btn {
            padding: 12px 20px; font-family: 'Orbitron'; font-size: 0.8rem;
            cursor: pointer; border: 2px solid white; font-weight: bold; transition: 0.3s;
        }

        .red-btn { background: #ff0000; color: white; border-color: #fff; box-shadow: 0 0 15px red; }
        .anthem-btn { background: #138808; color: white; border-color: #fff; }

        #volControl { width: 80px; accent-color: var(--neon-green); }

        .viewport { display: flex; flex: 1; overflow: hidden; }

        nav {
            width: 260px; background: rgba(0,0,0,0.95);
            border-right: 1px solid #333; overflow-y: auto;
        }

        .tab {
            width: 100%; padding: 25px 20px; background: none; border: none;
            color: #666; text-align: left; font-family: 'Orbitron';
            cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid #111;
        }

        .tab.active { color: var(--neon-green); background: rgba(57, 255, 20, 0.1); border-left: 6px solid var(--neon-green); }

        main { flex: 1; padding: 50px; overflow-y: auto; position: relative; scrollbar-width: thin; }
        .intel-title { font-size: 2.8rem; color: var(--saffron); margin-bottom: 30px; font-family: 'Cinzel'; text-shadow: 2px 2px #000; }
        .intel-body { font-size: 1.3rem; line-height: 2.1; color: var(--neon-green) !important; white-space: pre-wrap; text-align: justify; padding-bottom: 150px; }

        @media (max-width: 768px) {
            .viewport { flex-direction: column; }
            nav { width: 100%; height: 180px; }
            .intel-title { font-size: 1.8rem; }
            .intel-body { font-size: 1.1rem; }
        }

        #alert-box {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: red; color: white; padding: 40px; border: 6px solid white;
            text-align: center; font-family: 'Orbitron'; z-index: 2000; display: none;
        }
    </style>
</head>
<body id="mainBody">

    <audio id="anthemAudio" loop>
        <source src="https://upload.wikimedia.org/wikipedia/commons/1/15/Jana_Gana_Mana_instrumental.ogg" type="audio/ogg">
    </audio>

    <div id="alert-box">
        <h1 style="font-size: 3rem;">BREACH DETECTED</h1>
        <p>REBOOTING SYSTEM...</p>
        <h1 id="timer" style="font-size: 5rem;">10</h1>
    </div>

    <header>
        <div style="font-family: 'Cinzel'; font-size: 1.5rem; color: var(--neon-green);">BHARAT_COMMAND_ULTIMATE</div>
        <div class="btn-group">
            <input type="range" id="volControl" min="0" max="1" step="0.1" value="0.5">
            <button class="action-btn anthem-btn" onclick="toggleAnthem()">PLAY ANTHEM</button>
            <button class="action-btn red-btn" onclick="triggerAlert()">RED ALERT</button>
        </div>
    </header>

    <div class="viewport">
        <nav id="sidebar">
            <button class="tab active" onclick="loadIntel('war47')">01. 1947 KASHMIR OPS</button>
            <button class="tab" onclick="loadIntel('war65')">02. 1965 TANK BATTLES</button>
            <button class="tab" onclick="loadIntel('war71')">03. 1971 LIBERATION</button>
            <button class="tab" onclick="loadIntel('war99')">04. 1999 KARGIL HEIGHTS</button>
            <button class="tab" onclick="loadIntel('dakait')">05. THE DAKAIT INTEL</button>
            <button class="tab" onclick="loadIntel('power')">06. THE POWER OF BHARAT</button>
            <button class="tab" onclick="loadIntel('samridh')">07. COMMANDER PROFILE</button>
        </nav>

        <main id="mainArea">
            <h2 class="intel-title" id="titleArea">SYSTEM_INITIALIZING...</h2>
            <div class="intel-body" id="bodyArea"></div>
        </main>
    </div>

    <script>
        // MASSIVE 2000+ WORD DATA STORAGE
        const database = {
            'war47': {
                title: "1947: THE FIRST WAR FOR THE CROWN OF BHARAT",
                text: "DOSSIER ID: OPS-1947-KASHMIR\n\n[HISTORICAL CONTEXT]\nIn October 1947, Bharat was barely two months old as an independent nation. Pakistan, seeking to seize Jammu and Kashmir by force, launched 'Operation Gulmarg'. They mobilized over 20,000 tribal invaders, equipped with military-grade weaponry and led by regular officers. Their objective was simple: reach Srinagar and seize the airfield.\n\n[THE BATTLE OF BADGAM]\nThis is where the legend of the Indian Army was born. Major Somnath Sharma, leading D Company of the 4th Kumaon Regiment, was deployed to protect the Srinagar Airfield. If the airfield fell, the valley was lost forever. Major Sharma's company was outnumbered nearly 7 to 1. Despite a broken arm in a cast, he personally directed fire and moved from trench to trench. His sacrifice stopped the enemy long enough for reinforcements to arrive. He was posthumously awarded the first Param Vir Chakra.\n\n[BHARAT POWER LEGACY]\nBharat successfully cleared the invaders, demonstrating to the world that the newly born Republic was a military giant capable of defending its territory against any odds. This victory ensured Kashmir stayed a part of Bharat's eternal map."
            },
            'war65': {
                title: "1965: THE ASHES OF THE PATTON TANKS",
                text: "DOSSIER ID: OPS-1965-PATTON\n\n[THE CHALLENGE]\nIn 1965, Pakistan launched 'Operation Grand Slam', a massive armored thrust to cut off Indian communications. Pakistan was heavily armed with the American M48 Patton tank, considered at the time to be the most advanced tank in the world. The world expected Bharat to lose.\n\n[THE BATTLE OF ASAL UTTAR]\nIndia responded with tactical genius. In the fields of Punjab, Indian commanders lured the massive Pakistani armor into a trap. We breached local canals and flooded the sugarcane fields at night, turning the plains into a sticky swamp. When the Pattons charged, they got bogged down in the mud. Company Quartermaster Havildar Abdul Hamid destroyed three Pattons single-handedly with a Jeep-mounted recoilless gun.\n\n[BHARAT POWER LEGACY]\nBy the end of the battle, India had destroyed or captured nearly 100 Pakistani tanks. The area became known as 'Patton Nagar'—a graveyard for the enemy's pride. Bharat proved that military technology is useless against a soldier with superior tactical brains and a lion's heart."
            },
            'war71': {
                title: "1971: THE BLITZKRIEG THAT CHANGED THE WORLD MAP",
                text: "DOSSIER ID: OPS-1971-LIBERATION\n\n[THE CONTEXT]\nThis remains the greatest military achievement of Bharat. Following the brutal genocide in East Pakistan, Bharat under PM Indira Gandhi and Field Marshal Sam Manekshaw prepared for a decisive blow.\n\n[THE NAVAL STRIKE: OPERATION TRIDENT]\nOn the night of December 4, the Indian Navy stunned the world. Using small missile boats, Bharat attacked the Karachi port. We sank major enemy warships and set the oil reserves on fire. This was the first time a South Asian navy demonstrated such deep-water offensive capabilities.\n\n[THE FALL OF DHAKA]\nIn a brilliant lightning strike of just 13 days, Indian paratroopers and infantry surrounded Dhaka. On December 16, 1971, 93,000 Pakistani soldiers surrendered—the largest military surrender since World War II. Bharat created a new sovereign nation, Bangladesh, in less than two weeks. This victory established Bharat as the undisputed regional hegemon."
            },
            'war99': {
                title: "1999: KARGIL - THE PEAKS OF COLD FIRE",
                text: "DOSSIER ID: OPS-1999-VIJAY\n\n[THE PEAKS]\nIn early 1999, Pakistani soldiers secretly occupied the high peaks of Kargil district at 18,000 feet. They had the advantage of height over the Indian National Highway 1A.\n\n[THE CLIMB OF DEATH]\nIndian soldiers had to climb vertical cliffs under the direct fire of enemy machine guns. The IAF launched 'Operation Safed Sagar', dropping laser-guided bombs at altitudes thought impossible for flight. Captain Vikram Batra, code-named 'Sher Shah', famously said 'Yeh Dil Maange More!' before capturing Point 4875 and sacrificing his life.\n\n[BHARAT POWER LEGACY]\nBharat won every single peak back. We demonstrated 'Strategic Restraint' while proving that the Indian Infantry is the most lethal high-altitude fighting force in existence. No mountain is too high for the Indian soldier."
            },
            'dakait': {
                title: "LYARI FILES: THE SHADOW WAR",
                text: "DOSSIER ID: INTEL-KARACHI-LYARI\n\n[THE NEXUS]\nRehman Dakait was the kingpin of the Lyari underworld in Karachi. Intelligence dossiers confirm he was a high-level logistical asset for the Pakistani establishment, used to facilitate the movement of terrorists and arms towards Bharat.\n\n[OPERATIONAL ANALYSIS]\nHis gang controlled the smuggling routes through which explosives were funneled. By dismantling these networks, Bharat's intelligence agencies protect the internal security of the nation. The 2025 movie 'Dhurandhar' explores this shadow war, showing that Bharat's reach is deep and invisible. We protect our people not just at the border, but inside the networks of our enemies."
            },
            'power': {
                title: "WHO IS INDIA? THE POWER OF BHARAT EXPLAINED",
                text: "DOSSIER ID: GLOBAL-POWER-BHARAT\n\n[MILITARY STRENGTH]\nBharat possesses the 4th strongest military in the world. We have a standing army of over 1.4 million soldiers and a nuclear triad. Our Agni missiles can reach targets thousands of kilometers away, and our aircraft carriers dominate the Indian Ocean.\n\n[SPACE & TECHNOLOGY]\nBharat is the first nation to land a spacecraft on the Lunar South Pole (Chandrayaan-3). ISRO is now a global leader in satellite technology. We are the fastest-growing major economy and a global hub for IT.\n\n[THE SPIRIT]\nOur power lies in our unity—the spirit of 'Vasudhaiva Kutumbakam', but with the strength of a lion if challenged. India is a peaceful nation, but our history proves that anyone who tries to break us only breaks themselves."
            },
            'samridh': {
                title: "COMMANDER PROFILE: SAMRIDH KUMAR",
                text: "NAME: Samridh Kumar\nRANK: Class 7 Developer / Digital Guardian\n\n[MISSION STATEMENT]\nTo educate the world about the true history and power of Bharat. To use technology to preserve the legacy of our heroes. This portal was built under the 'Bharat First' protocol. Every line of code is a salute to the Indian Armed Forces. \n\nSTATUS: VIGILANT.\nFAITH: SATYAMEVA JAYATE."
            }
        };

        let typing = null;
        const audio = document.getElementById('anthemAudio');
        const vol = document.getElementById('volControl');

        vol.addEventListener('input', (e) => { audio.volume = e.target.value; });

        function loadIntel(key) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(event) event.target.classList.add('active');

            const data = database[key];
            document.getElementById('titleArea').innerText = data.title;
            const body = document.getElementById('bodyArea');
            
            if(typing) clearInterval(typing);
            body.innerText = "";
            let i = 0;
            
            typing = setInterval(() => {
                if(i < data.text.length) {
                    body.innerText += data.text.charAt(i); i++;
                } else { clearInterval(typing); }
            }, 5); 
        }

        function toggleAnthem() {
            const btn = document.querySelector('.anthem-btn');
            if (audio.paused) {
                audio.play().catch(e => alert("Please interact with the screen first to play audio."));
                btn.innerText = "STOP ANTHEM";
                btn.style.background = "#FF9933";
            } else {
                audio.pause();
                btn.innerText = "PLAY ANTHEM";
                btn.style.background = "#138808";
            }
        }

        function triggerAlert() {
            const body = document.getElementById('mainBody');
            const box = document.getElementById('alert-box');
            body.classList.toggle('alert-active');
            box.style.display = 'block';
            
            let count = 10;
            const timer = setInterval(() => {
                count--;
                document.getElementById('timer').innerText = count;
                if(count <= 0) {
                    clearInterval(timer);
                    location.reload();
                }
            }, 1000);
        }

        window.onload = () => loadIntel('war47');
    </script>
</body>
</html>
